    <style>
        :root {
            --bg-primary: #F7F7F5;
            --bg-surface: #FFFFFF;
            --text-main: #141414;
            --text-muted: #5C5C58;
            --border-color: #E2E2DE;
            --accent: #1B4332;
            --accent-hover: #2D6A4F;
            --accent-subtle: rgba(27, 67, 50, 0.08);
            --status-dot: #10B981;
        }

        [data-theme="dark"] {
            --bg-primary: #111110;
            --bg-surface: #1A1A18;
            --text-main: #F2F2F0;
            --text-muted: #9C9C96;
            --border-color: #2C2C2A;
            --accent: #52B788;
            --accent-hover: #74C69D;
            --accent-subtle: rgba(82, 183, 136, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.65;
            transition: background-color 0.25s ease, color 0.25s ease;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navbar */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 68px;
        }

        .brand {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--text-main);
        }

        /* Hero Section */
        .hero {
            padding: 80px 0 72px;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 48px;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            padding: 6px 12px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--status-dot);
            border-radius: 50%;
            display: inline-block;
        }

        h1 {
            font-size: clamp(2.25rem, 4.5vw, 3.4rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 560px;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
        }

        /* Photo Frame */
        .photo-wrapper {
            position: relative;
            max-width: 300px;
            margin-left: auto;
        }

        .photo-card {
            background-color: var(--bg-surface);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .photo-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            object-position: center top;
            border-radius: 8px;
            display: block;
            background-color: #d63031;
        }

        .photo-caption {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 0 4px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Sections General */
        section {
            padding: 72px 0;
            border-bottom: 1px solid var(--border-color);
        }

            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 40
